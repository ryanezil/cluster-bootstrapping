apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: camel-dashboard
spec:
  configMapRef:
    key: 16764_rev4.json
    name: camel-quarkus-dashboards
  datasources:
    - datasourceName: prometheus-ds
      inputName: DS_PROMETHEUS
  instanceSelector:
    matchLabels:
      app: grafana
      dashboards: grafana
