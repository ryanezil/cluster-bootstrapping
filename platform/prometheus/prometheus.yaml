# Reference:
# https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.Prometheus
# https://github.com/prometheus-operator/kube-prometheus/blob/main/manifests/prometheus-prometheus.yaml

apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  serviceAccountName: prometheus-server
  # Select PodMonitors from any namespace
  podMonitorNamespaceSelector: {}
  # Select all PodMonitors found in the selected namespaces
  podMonitorSelector: {}
  probeNamespaceSelector: {}
  probeSelector: {}
  serviceMonitorNamespaceSelector: {}
  serviceMonitorSelector: {}
#  serviceMonitorSelector:
#    matchLabels:
#      app.kubernetes.io/name: prometheus
  resources:
    requests:
      memory: 400Mi
      cpu: 300m
    limits:
      memory: 1Gi
      cpu: 1
  enableAdminAPI: false
  additionalScrapeConfigs:
    name: additional-scrape-configs
    key: prometheus-additional.yaml
