apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: streams-kafka
  namespace: openshift-gitops
spec:
  destination:
    # NOTE: This namespace value is hardcoded in the files:
    # + strimzi-pod-monitor.yaml
    # + grafana-cluster-monitoring-binding.yaml
    namespace: streams-kafka
    server: "https://kubernetes.default.svc"
  # Target ArgoCD project where this application will be created
  project: playground
  source:
    repoURL: "https://github.com/ryanezil/cluster-bootstrapping"
    path: platform/streams-kafka
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
